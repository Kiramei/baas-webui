name: Demonstration of baas-webui

on:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Modify vite.config.ts for GitHub Pages
        run: |
          sed -i 's|base: "/"|base: "/baas-webui/"|' vite.config.ts

      - name: Build Project
        run: bun run build

      - name: Deploy Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./dist